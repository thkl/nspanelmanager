substitutions:
  hostname: nspanel
  device_name: NSPanel
  display_update_url: "http://update.th-kl.de/firmware/nspanel/nspanel_blank.tft"

external_components:
  - source:
      type: local
      path: ../esphome_components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  use_address: 192.168.178.111

http_request:
  verify_ssl: true

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: http_request
    on_begin:
      then:
        - if:
            condition:
              lambda: return !id(pending_firmware_job_id).empty();
            then:
              - script.execute:
                  id: publish_firmware_update_status
                  job_id: !lambda return id(pending_firmware_job_id);
                  status: uploading
                  version: !lambda return id(pending_firmware_version);
                  message: Firmware download started.
                  progress: 0
    on_progress:
      then:
        - lambda: |-
            if (id(pending_firmware_job_id).empty()) return;
            const int progress = static_cast<int>(x);
            if (progress >= id(firmware_update_last_progress) + 10 || progress >= 100) {
              id(firmware_update_last_progress) = progress;
              id(publish_firmware_update_status)->execute(
                id(pending_firmware_job_id), "uploading", id(pending_firmware_version), "Firmware download in progress.", progress);
            }
    on_end:
      then:
        - if:
            condition:
              lambda: return !id(pending_firmware_job_id).empty();
            then:
              - script.execute:
                  id: publish_firmware_update_status
                  job_id: !lambda return id(pending_firmware_job_id);
                  status: rebooting
                  version: !lambda return id(pending_firmware_version);
                  message: Firmware installed; waiting for the panel to reboot.
                  progress: 100
              - delay: 750ms
    on_error:
      then:
        - if:
            condition:
              lambda: return !id(pending_firmware_job_id).empty();
            then:
              - script.execute:
                  id: publish_firmware_update_status
                  job_id: !lambda return id(pending_firmware_job_id);
                  status: failed
                  version: !lambda return id(pending_firmware_version);
                  message: !lambda return "ESPHome OTA failed with error " + esphome::to_string(x) + ".";
                  progress: -1
              - lambda: |-
                  id(pending_firmware_job_id).clear();
                  id(pending_firmware_version).clear();
                  id(firmware_update_last_progress) = 0;
                  pending_firmware_job_id->update();
                  pending_firmware_version->update();
                  esphome::global_preferences->sync();

logger:
  level: ERROR

debug:
  update_interval: 5s

packages:
  unified_panel: !include panel-unified.yaml
