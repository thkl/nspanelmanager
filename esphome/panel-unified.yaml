  - id: proceed_hmi_update  #we have to unsubscribe from all mqtt messages during the hmi update ; processing a message and sending info to the display will interrupt the update
    then:
      - if:
          condition:
            lambda: return !id(pending_hmi_version).empty();
          then:
            - lambda: |-
                id(hmi_update_pending) = true;
                pending_hmi_version->update();
                hmi_update_pending->update();
                esphome::global_preferences->sync();
      - script.execute:
          id: publish_hmi_update_status
          job_id: !lambda return id(pending_hmi_job_id);
          status: uploading
          version: !lambda return id(pending_hmi_version);
          message: ""
      - delay: 500ms
      - lambda: |-
          id(mqtt_client).disable();
          id(disp1).set_backlight_brightness(1);
          if (!id(disp1).upload_tft()) {
            ESP_LOGE("hmi", "TFT upload failed; clearing the pending HMI version ID");
            std::string failed_job_id = id(pending_hmi_job_id);
            std::string failed_version = id(pending_hmi_version);
            id(pending_hmi_version).clear();
            id(hmi_update_pending) = false;
            pending_hmi_version->update();
            hmi_update_pending->update();
            esphome::global_preferences->sync();
            id(mqtt_client).enable();
            id(report_hmi_update_failure)->execute(failed_job_id, failed_version);
          }

  - id: report_hmi_update_failure
    parameters:
      job_id: std::string
      version: std::string
    then:
      - wait_until:
          condition:
            mqtt.connected:
          timeout: 15s
      - script.execute:
          id: publish_hmi_update_status
          job_id: !lambda return job_id;
          status: failed
          version: !lambda return version;
          message: "Nextion TFT upload failed."
      - lambda: |-
          id(pending_hmi_job_id).clear();
          pending_hmi_job_id->update();
          esphome::global_preferences->sync();


