    - topic: cmnd/music
      then:
        - lambda: |-
                    if ($diagnostic_ignore_music_commands) {
                      ESP_LOGW("music", "Diagnostic build ignored cmnd/music snapshot");
                      return;
                    }
                    if (!x["status"].is<JsonArrayConst>()) return;
                    JsonArrayConst players = x["status"];
                    const int selected_player = id(selectedMusicPlayer);
                    const bool selected_player_valid = selected_player >= 0 &&
                      selected_player < static_cast<int>(id(sonosTrackByPlayer).size()) &&
                      selected_player < static_cast<int>(id(sonosPlaybackStateByPlayer).size()) &&
                      selected_player < static_cast<int>(id(sonosCoordinatorByPlayer).size());
                    const std::string previous_selected_track = selected_player_valid ? id(sonosTrackByPlayer)[selected_player] : "";
                    const int previous_selected_state = selected_player_valid ? id(sonosPlaybackStateByPlayer)[selected_player] : 0;
                    const int previous_selected_coordinator = selected_player_valid ? id(sonosCoordinatorByPlayer)[selected_player] : -1;

                    for (auto &track : id(sonosTrackByPlayer)) track = "[STOP]";
                    for (auto &state : id(sonosPlaybackStateByPlayer)) state = 0;
                    for (auto &coordinator : id(sonosCoordinatorByPlayer)) coordinator = -1;

                    for (JsonVariantConst player_value : players) {
                      const JsonObjectConst player = player_value.as<JsonObjectConst>();
                      if (!player["playerid"].is<int>()) continue;
                      const int player_id = player["playerid"].as<int>();
                      if (player_id < 0 || player_id >= static_cast<int>(id(sonosTrackByPlayer).size())) continue;
                      if (player["currenttrack"].is<std::string>()) {
                        id(sonosTrackByPlayer)[player_id] = player["currenttrack"].as<std::string>();
                      }
                      if (player["currentstate"].is<int>()) {
                        id(sonosPlaybackStateByPlayer)[player_id] = player["currentstate"].as<int>();
                      }
                      if (player["isCoordinator"].is<bool>()) {
                        id(sonosCoordinatorByPlayer)[player_id] = player["isCoordinator"].as<bool>() ? 1 : 0;
                      }
                    }

                    if (selected_player_valid &&
                        (previous_selected_track != id(sonosTrackByPlayer)[selected_player] ||
                         previous_selected_state != id(sonosPlaybackStateByPlayer)[selected_player] ||
                         previous_selected_coordinator != id(sonosCoordinatorByPlayer)[selected_player])) {
                      if (previous_selected_track != id(sonosTrackByPlayer)[selected_player] &&
                          !id(sleeping) && id(currentPage) == "page0") {
                        id(update_time)->execute();
                      }
                      if ($diagnostic_skip_music_display) {
                        ESP_LOGW("music", "Diagnostic build skipped music display refresh");
                      } else {
                        id(refresh_music_after_snapshot)->execute();
                      }
                    }

