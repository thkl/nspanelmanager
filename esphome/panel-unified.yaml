                    if (!array[i].containsKey("label") || !array[i].containsKey("value")) continue;
                    std::string label = array[i]["label"].as<std::string>();
                    id(levelPagelabels)[i] = label;
                    float vl = array[i]["value"].as<float>();
                    id(levelPageValues)[i] = vl;
                }
              }
        - script.execute: update_level

    - topic: cmnd/level/config
      then:
        - lambda: |-
              JsonObjectConst root = x;
              if (root.containsKey("settings")){
                JsonArrayConst array = root["settings"];
                int arraySize =  array.size();

                if (arraySize > 3) {
                  for (int i = 0; i < 4; i++){
                    std::string label = array[i]["label"].as<std::string>();
                    id(levelPagelabels)[i] = label;
                    float vl = array[i]["value"].as<float>();
                    id(levelPageValues)[i] = vl;
                  }
                }

                if (arraySize > 7) {
                  for (int i = 4; i < 8; i++){
                    std::string label = array[i]["label"].as<std::string>();
                    id(levelPagelabels)[i] = label;
                    float vl = array[i]["value"].as<float>();
                    id(levelPageValues)[i] = vl;
                  }
                } else {
                  for (int i = 4; i < 8; i++){
                    id(levelPagelabels)[i] = "";
                    id(levelPageValues)[i] = -100;
                  }
                }

              }

              if (root.containsKey("levelTopic")){
                id(levelTopic) = root["levelTopic"].as<std::string>();
              }

                if (root.containsKey("topic")){
                id(infoTopic) = root["topic"].as<std::string>();
              }

              if (root.containsKey("name")){
                id(levelPagelabels)[8] = root["name"].as<std::string>();
              }
        - script.execute: update_level

    - topic: cmnd/thermostate/target
      then:
        - lambda: |-
              float itargetTemperature = 0;
              if (x.containsKey("temperature")){
                  itargetTemperature = x["temperature"];
                  id(targetTemperature) = itargetTemperature;
              }
              ESP_LOGD("custom","MQTT Thermostate Settings Set target");

        - script.execute: update_thermostate

    - topic: cmnd/thermostate/current
      then:
        - lambda: |-
              float iCurrentTemperature = 0;
              if (x.containsKey("temperature")){
                  ESP_LOGD("custom","MQTT Thermostate Settings Set current");
                  iCurrentTemperature = x["temperature"];
                  id(temperature) = iCurrentTemperature;
                  id(disp1).send_command_printf("page0.vaTemp.txt=\"%.1f ""\xb0""C \"",  id(temperature));
              }

        - script.execute: update_thermostate
        - script.execute: update_display

    - topic: cmnd/colorLamp
      then:
        - lambda: |-
              id(disp1).send_command_printf("page pageColorLight");
              if (x.containsKey("label")){
                const char *lbl = x["label"];
                id(disp1).send_command_printf("pageColorLight.tLight.txt=\"%s\"",lbl);
              }
              if (x.containsKey("id")){
                const char *idl = "";
                idl = x["id"];
                id(colorLamp) = idl;
              }

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    on_time_sync:
      then:
        - lambda: |-
            ESP_LOGI("clock", "SNTP time synchronized; refreshing the panel clock");
            id(homeDisplayCacheValid) = false;
        - script.execute: update_time
    on_time:
      - seconds: 0
        minutes: "*"
        then:
          - script.execute: update_time
          - lambda: |-
              if (id(screenSync)==false) {
                id(screenSync) = true;
                // reset the timer
                id(disp1).send_command_printf("Screensaver.tmpBlink.en=0");
                id(disp1).send_command_printf("Screensaver.tmpBlink.en=1");
              }
              id(publish_panel_ping).execute();

