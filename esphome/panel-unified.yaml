      - script.execute: do_reset_sonosPlayer


mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  id: mqtt_client
  topic_prefix: nspanel
  discovery: true
  discover_ip: true
  on_connect:
    then:
      - delay: 500ms
      - mqtt.publish_json:
          topic: !lambda |-
            return id(mqtt_client).get_topic_prefix() + "/event/init";
          payload: |-
            root["mac"] = id(panel_mqtt_client).get_mac_address();
            root["node_name"] = id(panel_mqtt_client).get_active_topic_prefix();
            root["firmware_version"] = "$firmware_version";
      - if:
          condition:
            lambda: return id(panel_mqtt_client).has_active_alias() && id(disp1).is_setup();
          then:
            - script.execute: publish_panel_display_ready
      - if:
          condition:
            lambda: return !id(pending_firmware_version).empty();
          then:
            - if:
                condition:
                  lambda: return id(pending_firmware_version) == "$firmware_version";
                then:
                  - script.execute:
                      id: publish_firmware_update_status
                      job_id: !lambda return id(pending_firmware_job_id);
                      status: succeeded
                      version: !lambda return id(pending_firmware_version);
                      message: Panel rebooted with the requested firmware version.
                      progress: 100
                else:
                  - if:
                      condition:
                        lambda: return !id(pending_firmware_job_id).empty();
                      then:
                        - script.execute:
                            id: publish_firmware_update_status
                            job_id: !lambda return id(pending_firmware_job_id);
                            status: failed
                            version: !lambda return id(pending_firmware_version);
                            message: The panel rebooted without the requested firmware version.
                            progress: -1
            - delay: 500ms
            - lambda: |-
                id(pending_firmware_job_id).clear();
                id(pending_firmware_version).clear();
                id(firmware_update_last_progress) = 0;
                pending_firmware_job_id->update();
                pending_firmware_version->update();
                esphome::global_preferences->sync();

panel_mqtt:
  id: panel_mqtt_client
  on_json_message:

    - topic: cmnd/beep
      then:
        - rtttl.play: "beep:d=32,o=5,b=200:e"


    - topic: cmnd/song
      then:
        - rtttl.play:
            rtttl: !lambda 'return x["song"];'

    - topic: cmnd/goto
      then:
        - lambda: |-
               if (x.containsKey("page")){
                  const char *page = x["page"];
                  id(disp1).goto_page(page);
               }

    - topic: cmnd/night
      then:
        - lambda: |-
               if (x.containsKey("night")){
                  int night = x["night"]; 
                  id(disp1).send_command_printf("page0.vaNightMode.val=%d",night);
                  if (night==1) {
                    id(disp1).send_command_printf("page Screensaver");
                  } else {
                    id(disp1).send_command_printf("page pageWeather");
                  }
               }

    - topic: cmnd/group/settings
      then:
        - lambda: |-
            if (!x["request_id"].is<const char*>()) return;
            const std::string request_id = x["request_id"].as<std::string>();
            if (request_id.empty() || request_id.size() > 64) return;
            const bool has_night = x.containsKey("night");
            const bool has_brightness = x.containsKey("brightness");
            if (!has_night && !has_brightness) return;
            if (has_night && (!x["night"].is<int>() || (x["night"].as<int>() != 0 && x["night"].as<int>() != 1))) return;
            if (has_brightness && (!x["brightness"].is<int>() || x["brightness"].as<int>() < 0 || x["brightness"].as<int>() > 100)) return;
            const int night = has_night ? x["night"].as<int>() : 0;
            const int brightness = has_brightness ? x["brightness"].as<int>() : 0;
            id(apply_panel_group_settings)->execute(request_id, has_night, night, has_brightness, brightness);
    
    - topic: cmnd/weather
      then:
        - lambda: |-

               if (id(currentPage) == "pageWeather" && x.containsKey("current")){
                  JsonObjectConst current = x["current"];
                   if (current.containsKey("tempc")){
                   int tempc = current["tempc"]; 
                   id(disp1).send_command_printf("pageWeather.vTempC.txt=\"%d\"",tempc);
                  }

                  if (current.containsKey("rain")){
                    int rain = current["rain"]; 
                    id(disp1).send_command_printf("pageWeather.vRain.txt=\"%d\"",rain);
                  }

                  if (current.containsKey("wind")){
                    int wind = current["wind"]; 
                    id(disp1).send_command_printf("pageWeather.vWind.txt=\"%d m/s\"",wind);
                  }

                  if (current.containsKey("condition")){
                    const char *condition = current["condition"]; 
                    id(disp1).send_command_printf("pageWeather.vCond.txt=\"%s\"",condition);
                  }
               }

               if (id(currentPage)=="pageWeather") {
                  if (x.containsKey("forecast")){
                      JsonArrayConst array = x["forecast"];
                      int arraySize =  array.size();
                      if (arraySize > 5) { arraySize = 5;}
                      for (int i = 0; i < arraySize; i++) {
                            if (array[i].containsKey("day")) id(disp1).send_command_printf("pageWeather.td%d.txt=\"%s\"",(i+1), array[i]["day"].as<std::string>().c_str());
                            if (array[i].containsKey("temp")) id(disp1).send_command_printf("pageWeather.tt%d.txt=\"%s\"",(i+1), array[i]["temp"].as<std::string>().c_str());
                            if (array[i].containsKey("rain")) id(disp1).send_command_printf("pageWeather.tr%d.txt=\"%s\"",(i+1), array[i]["rain"].as<std::string>().c_str());
                            if (array[i].containsKey("wind")) id(disp1).send_command_printf("pageWeather.tw%d.txt=\"%s\"",(i+1), array[i]["wind"].as<std::string>().c_str());
                            if (array[i].containsKey("cond")) id(disp1).send_command_printf("pageWeather.tc%d.txt=\"%s\"",(i+1), array[i]["cond"].as<std::string>().c_str());
                        
                      }
                  }
               }

    - topic: cmnd/message
      then:
        - lambda: |-
              id(wakeupMode) = 1; // set this to 1 to prevent query the config and refresh to page0
              id(disp1).set_backlight_brightness(1);
              id(disp1).goto_page("Message");

              const char *title = "Message";
              const char *msg = "-";

              if (x.containsKey("title")){
                title = x["title"];
              }

              id(disp1).set_component_text("p4tTitle",title);

              if (x.containsKey("message")){
                id(disp1).send_command_printf("Message.p4tMessageS.txt=\"%s\"",(x["message"].as<std::string>()).c_str());
              }


              if (x.containsKey("silent")){
                  id(silentMessage) = true;
              } else {
                  id(silentMessage) = false;
              }

              if (x.containsKey("timeout")){               // check if there is a timeout in the message
                int seconds = 90;
                seconds = x["timeout"];                    // yes so get the seconds
                id(disp1).send_command_printf("Message.p4Timeout.val=%d",seconds); // set the seconds into the counter
                id(disp1).send_command_printf("Message.p4tTimer.val=%d",seconds); // also fill the label
                id(disp1).send_command_printf("Message.p4Timer.en=1"); // enable the timer
                id(disp1).send_command_printf("vis Message.p4tTimer,1"); // enable the label
              }

              
  
        - script.execute: update_time
        - rtttl.play: !lambda 'if (id(silentMessage) == false) {return  "mario:d=4,o=5,b=100:16e6,16e6,32p,8e6,16c6,8e6,8g6,8p";} else {return "";}'

    - topic: cmnd/settings/brightness
      then:
        - lambda: |-
                  if (x.containsKey("brightness")){
                    int brightness = 100;
                    brightness = x["brightness"];
                    id(disp1).send_command_printf("page0.vaBrightnessWeather.val=%d", brightness);
                    if (id(currentPage)=="pageWeather") {
                      id(disp1).send_command_printf("dims=%d", brightness);
                    }
                  }

    - topic: cmnd/identity
      then:
        - if:
            condition:
              lambda: return x["mqtt_alias"].is<const char*>();
            then:
              - lambda: |-
                  const std::string mqtt_alias = x["mqtt_alias"].as<std::string>();
                  if (!id(panel_mqtt_client).set_active_topic_prefix(mqtt_alias)) {
                    ESP_LOGW("mqtt", "Ignoring invalid MQTT node name in identity assignment");
                    return;
                  }
                  if (id(saved_panel_node_name) != mqtt_alias) {
                    id(saved_panel_node_name) = mqtt_alias;
                    esphome::global_preferences->sync();
                  }
                  id(initial) = true;
              - delay: 100ms
              - script.execute: publish_panel_ready
              - if:
                  condition:
                    lambda: return id(disp1).is_setup();
                  then:
                    - script.execute: publish_panel_display_ready
              - script.execute: publish_panel_ping

    - topic: cmnd/settings
      then:
        - lambda: |-
              const bool identity_only = x.size() == 1 && x["mqtt_alias"].is<const char*>();
              id(initial) = true;
              if (x["mqtt_alias"].is<const char*>()) {
                const std::string mqtt_alias = x["mqtt_alias"].as<std::string>();
                if (!id(panel_mqtt_client).set_active_topic_prefix(mqtt_alias)) {
                  ESP_LOGW("mqtt", "Ignoring invalid MQTT node name in settings");
                } else if (id(saved_panel_node_name) != mqtt_alias) {
                  id(saved_panel_node_name) = mqtt_alias;
                  esphome::global_preferences->sync();
                }
              }
              if (!identity_only) id(disp1).send_command_printf("thsp=0");

              if (x.containsKey("panelname")){
                  const char *cPanelname = "-";
                  cPanelname = x["panelname"];
                  id(panelname) = cPanelname;
                  id(disp1).set_component_text("p0tTitle", id(panelname).c_str());
              }

              if (x.containsKey("currenttemperature")){
                  ESP_LOGD("custom","MQTT Thermostate Settings Set");
                  float iCurrentTemperature = 0;
                  iCurrentTemperature = x["currenttemperature"];
                  id(temperature) = iCurrentTemperature;
                  id(disp1).send_command_printf("page0.vaTemp.txt=\"%.1f ""\xb0""C \"",  id(temperature));
              }

              if (x.containsKey("brightness")){
                  int brightness = 100;
                  brightness = x["brightness"];
                  id(disp1).send_command_printf("page0.vaBrightness.val=%d", brightness);
              }

              if (x.containsKey("screensaver")){
                  int iScreenSaver = 0;
                  ESP_LOGD("SETTINGS","Update Screensaver");
                  iScreenSaver = x["screensaver"];
                  id(screensaver) = iScreenSaver;
                  id(disp1).send_command_printf("page0.vScreenSaver.val=%d",id(screensaver)); // also fill the variable
                  if (iScreenSaver == 0) {
                    id(disp1).send_command_printf("thsp=0");
                  }
              }

              if (x.containsKey("roomstatus")){
                  int iroomstatus = 0;
                  ESP_LOGD("SETTINGS","Update roomstatus");
                  iroomstatus = x["roomstatus"].as<int>();
                  id(roomstatus).state = iroomstatus;
                  id(disp1).send_command_printf("page0.vAirQuality.val=%d",(int)id(roomstatus).state);
              }
              
              if (x.containsKey("nightmode")){
                  int night = x["nightmode"]; 
                  id(disp1).send_command_printf("page0.vaNightMode.val=%d",night);
              }

              // if the settings contains buttons .. we will override the default buttons in id(mainIcons)
              if (x.containsKey("buttons")){
                  ESP_LOGD("SETTINGS","Update Buttons");
                  JsonArrayConst array = x["buttons"];
                  int arraySize =  array.size();
