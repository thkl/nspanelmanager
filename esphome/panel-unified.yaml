  - id: update_music
    parameters:
      single: bool

    then:
      - lambda: |-
                const int selected_player = id(selectedMusicPlayer);
                if (selected_player >= 0 && selected_player < static_cast<int>(id(sonosTrackByPlayer).size())) {
                  id(sonosTrack) = id(sonosTrackByPlayer)[selected_player];
                  if (id(sonosTrack).empty()) id(sonosTrack) = "[STOP]";
                  id(sonosIsCoordinator) = id(sonosCoordinatorByPlayer)[selected_player] == 1;
                }

                if (id(currentPage)=="page0") {
                  if (!id(homeSongCacheValid) || id(sonosTrack) != id(lastHomeSong)) {
                    id(disp1).send_command_printf("page0.vCurrentSong.txt=\"%s\"", id(sonosTrack).c_str());
                    id(disp1).set_component_text("p0bMusic", id(sonosTrack).c_str());
                    id(lastHomeSong) = id(sonosTrack);
                    id(homeSongCacheValid) = true;
                  }
                }

                if (id(currentPage)=="pageMusic") {

                  id(disp1).set_component_text("p3bMusic", id(sonosTrack).c_str());
                  if (id(musicMode)==0) {
                      id(disp1).set_component_text("p3b0", "");

                      const bool selected_player_playing = selected_player >= 0 &&
                        selected_player < static_cast<int>(id(sonosPlaybackStateByPlayer).size()) &&
                        id(sonosPlaybackStateByPlayer)[selected_player] == 1;
                      if (!selected_player_playing) {
                        id(disp1).set_component_text("p3b1", "Play");
                      } else {
                        id(disp1).set_component_text("p3b1", "Pause");
                      }

                      id(disp1).set_component_text("p3b2", "Stop");

                      if (id(sonosIsCoordinator) == true) {
                        id(disp1).set_component_text("p3b3", "Join");
                      } else {
                        id(disp1).set_component_text("p3b3", "Leave");
                      }
                      id(disp1).set_component_text("p3b4", "Favourites");
                      id(disp1).set_component_text("p3b5", "Prevs");
                      id(disp1).set_component_text("p3b6", "Next");
                      int selected_player_slot = -1;
                      for (int i = 0; i < static_cast<int>(id(musicPlayer).size()); i++) {
                        if (id(musicPlayer)[i] == selected_player) {
                          selected_player_slot = i;
                          break;
                        }
                      }
                      if (selected_player_slot >= 0) {
                        id(disp1).send_command_printf("p3tTitle.txt=pageMusic.vPlayer%d.txt", selected_player_slot);
                      } else {
                        id(disp1).set_component_text("p3tTitle", "");
                      }
                  } else {
                      if (id(musicMode)==1) {
                        id(disp1).set_component_text("p3tTitle", " Switch to:");
                      }

                      if (id(musicMode)==2) {
                        id(disp1).set_component_text("p3tTitle", " Join:");
                      }

                      for (int i = 0 ; i<6;i++) {
                        id(disp1).send_command_printf("pageMusic.p3b%d.txt=pageMusic.vPlayer%d.txt",i,i);
                      }
                      id(disp1).set_component_text("p3b6", "Cancel");
                  }
                }


