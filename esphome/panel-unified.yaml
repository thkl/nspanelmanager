    - topic: cmnd/updatehmi
      then:
        - lambda: |-
              if (id(firmware_update_waiting_for_confirmation) || !id(pending_firmware_job_id).empty() || !id(requested_firmware_job_id).empty()) {
                ESP_LOGW("hmi", "Rejected HMI update while a firmware update is pending");
                return;
              }
              std::string hmi_version = "";
              if (x.containsKey("version")) {
                hmi_version = x["version"].as<std::string>();
                bool valid_version = hmi_version.size() == 64;
                for (char c : hmi_version) {
                  if (!((c >= '0' && c <= '9') || (c >= 'a' && c <= 'f') || (c >= 'A' && c <= 'F'))) {
                    valid_version = false;
                    break;
                  }
                }
                if (!valid_version) {
                  ESP_LOGW("hmi", "Rejected an invalid HMI version ID");
                  return;
                }
              }
              if (x.containsKey("url")) {
                std::string update_url = x["url"].as<std::string>();
                if (update_url.empty() || update_url.size() > 512 ||
                    (update_url.rfind("http://", 0) != 0 && update_url.rfind("https://", 0) != 0)) {
                  ESP_LOGW("hmi", "Rejected an invalid HMI download URL");
                  return;
                }
                id(disp1).set_tft_url(update_url);
              }
              std::string job_id = x.containsKey("job_id") ? x["job_id"].as<std::string>() : "";
              if (!job_id.empty()) {
                bool valid_job_id = job_id.size() == 36;
                for (size_t i = 0; valid_job_id && i < job_id.size(); i++) {
                  if (i == 8 || i == 13 || i == 18 || i == 23) valid_job_id = job_id[i] == '-';
                  else {
                    const char c = job_id[i];
                    valid_job_id = (c >= '0' && c <= '9') || (c >= 'a' && c <= 'f') || (c >= 'A' && c <= 'F');
                  }
                }
                if (!valid_job_id) {
                  ESP_LOGW("hmi", "Rejected an invalid HMI update job ID");
                  return;
                }
              }
              id(pending_hmi_version) = hmi_version;
              id(pending_hmi_job_id) = job_id;
              id(hmi_update_pending) = false;
              pending_hmi_version->update();
              pending_hmi_job_id->update();
              hmi_update_pending->update();
              esphome::global_preferences->sync();
              if (x.containsKey("force") && x["force"].is<bool>() && x["force"].as<bool>()) {
                 id(proceed_hmi_update).execute();
              } else {
                id(disp1).set_backlight_brightness(1);
                id(disp1).send_command_printf("pageList.tTitle.txt=\"%s\"","HMI Update");
                id(disp1).send_command_printf("pageList.vaMessage.txt=\"%s\"","Press the UPDATE Button to start");
                id(disp1).send_command_printf("pageList.vLevel.val=0");
                id(disp1).send_command_printf("pageList.vMaxLevel.val=0");
                id(disp1).send_command_printf("page pageList");
                id(disp1).send_command_printf("pageList.b%d.txt=\"%s\"",0,"");
                id(disp1).send_command_printf("pageList.b%d.txt=\"%s\"",1,"");
                id(disp1).send_command_printf("pageList.b%d.txt=\"%s\"",2,"");
                id(disp1).send_command_printf("pageList.b%d.txt=\"%s\"",3,"UPDATE");
                id(disp1).send_command_printf("vis pageList.b3,1");
                id(hmiupdate) = 1;
                id(publish_hmi_update_status)->execute(job_id, "awaiting_confirmation", hmi_version, "Confirm the update on the panel.");
              }

    - topic: cmnd/updatefirmware
      then:
        - lambda: |-
              if (id(hmiupdate) == 1 || id(hmi_update_pending) || !id(pending_hmi_job_id).empty()) {
                ESP_LOGW("firmware", "Rejected firmware update while an HMI update is pending");
                return;
              }
              if (id(firmware_update_waiting_for_confirmation) || !id(pending_firmware_job_id).empty() || !id(requested_firmware_job_id).empty()) {
                ESP_LOGW("firmware", "Rejected a second firmware update request");
                return;
              }
              if (!x.containsKey("url") || !x["url"].is<std::string>() ||
                  !x.containsKey("md5") || !x["md5"].is<std::string>() ||
                  !x.containsKey("version") || !x["version"].is<std::string>()) {
                ESP_LOGW("firmware", "Rejected firmware update without URL, MD5, and version");
                return;
              }
              std::string update_url = x["url"].as<std::string>();
              std::string update_md5 = x["md5"].as<std::string>();
              std::string update_version = x["version"].as<std::string>();
              if (update_url.empty() || update_url.size() > 512 ||
                  (update_url.rfind("http://", 0) != 0 && update_url.rfind("https://", 0) != 0)) {
                ESP_LOGW("firmware", "Rejected an invalid firmware download URL");
                return;
              }
              bool valid_md5 = update_md5.size() == 32;
              for (char c : update_md5) {
                if (!((c >= '0' && c <= '9') || (c >= 'a' && c <= 'f') || (c >= 'A' && c <= 'F'))) {
                  valid_md5 = false;
                  break;
                }
              }
              bool valid_version = !update_version.empty() && update_version.size() <= 40;
              for (char c : update_version) {
                if (!((c >= '0' && c <= '9') || (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') || c == '.' || c == '-' || c == '_' || c == '+')) {
                  valid_version = false;
                  break;
                }
              }
              if (!valid_md5 || !valid_version) {
                ESP_LOGW("firmware", "Rejected invalid firmware MD5 or version");
                return;
              }
              std::string job_id = x.containsKey("job_id") && x["job_id"].is<std::string>() ? x["job_id"].as<std::string>() : "";
              if (!job_id.empty()) {
                bool valid_job_id = job_id.size() == 36;
                for (size_t i = 0; valid_job_id && i < job_id.size(); i++) {
                  if (i == 8 || i == 13 || i == 18 || i == 23) valid_job_id = job_id[i] == '-';
                  else {
                    const char c = job_id[i];
                    valid_job_id = (c >= '0' && c <= '9') || (c >= 'a' && c <= 'f') || (c >= 'A' && c <= 'F');
                  }
                }
                if (!valid_job_id) {
                  ESP_LOGW("firmware", "Rejected an invalid firmware update job ID");
                  return;
                }
              }
              if (x.containsKey("force") && !x["force"].is<bool>()) {
                ESP_LOGW("firmware", "Rejected a firmware update with a non-boolean force option");
                return;
              }
              id(requested_firmware_url) = update_url;
              id(requested_firmware_md5) = update_md5;
              id(requested_firmware_version) = update_version;
              id(requested_firmware_job_id) = job_id;
              if (x.containsKey("force") && x["force"].as<bool>()) {
                id(start_firmware_update).execute();
                return;
              }
              id(disp1).set_backlight_brightness(1);
              id(disp1).send_command_printf("pageList.tTitle.txt=\"%s\"", "Firmware Update");
              id(disp1).send_command_printf("pageList.vaMessage.txt=\"%s\"", "Press UPDATE to install firmware");
              id(disp1).send_command_printf("pageList.vLevel.val=0");
              id(disp1).send_command_printf("pageList.vMaxLevel.val=0");
              id(disp1).send_command_printf("page pageList");
              id(disp1).send_command_printf("pageList.b%d.txt=\"%s\"", 0, "");
              id(disp1).send_command_printf("pageList.b%d.txt=\"%s\"", 1, "");
              id(disp1).send_command_printf("pageList.b%d.txt=\"%s\"", 2, "");
              id(disp1).send_command_printf("pageList.b%d.txt=\"%s\"", 3, "UPDATE");
              id(disp1).send_command_printf("vis pageList.b3,1");
              id(hmiupdate) = 0;
              id(firmware_update_waiting_for_confirmation) = true;
              id(publish_firmware_update_status)->execute(job_id, "awaiting_confirmation", update_version, "Confirm the firmware update on the panel.", -1);

