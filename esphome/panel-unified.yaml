#internal relay 1
  - platform: panel_mqtt
    name: $device_name switch relay 1
    id: mqtt_relay_1
    internal: true
    topic: cmnd/relay/1
    on_value:
      then:
        - lambda: |-
              if (id(mqtt_relay_1).state=="0") {
                id(relay_1).turn_off();
              }
              if (id(mqtt_relay_1).state=="1") {
                id(relay_1).turn_on();
              }
              if (id(mqtt_relay_1).state=="toggle") {
                id(relay_1).toggle();
              }

#internal relay 2
  - platform: panel_mqtt
    name: $device_name switch relay 2
    id: mqtt_relay_2
    internal: true
    topic: cmnd/relay/2
    on_value:
      then:
        - lambda: |-
              if (id(mqtt_relay_2).state=="0") {
                id(relay_2).turn_off();
              }
              if (id(mqtt_relay_2).state=="1") {
                id(relay_2).turn_on();
              }
              if (id(mqtt_relay_2).state=="toggle") {
                id(relay_2).toggle();
              }

