  - platform: debug
    free:
      name: $device_name Free Heap
      id: debug_heap_free
      internal: true
    min_free:
      name: $device_name Minimum Free Heap
      id: debug_heap_min_free
      internal: true
    block:
      name: $device_name Largest Free Heap Block
      id: debug_heap_block
      internal: true
    loop_time:
      name: $device_name Main Loop Time
      id: debug_loop_time
      internal: true

  - platform: internal_temperature
    name: $device_name Chip Temperature
    id: panel_chip_temperature
    internal: true
    update_interval: 30s

  - platform: uptime
    name: $device_name Uptime
    id: panel_uptime
    internal: true
    type: seconds
    update_interval: 30s

  - platform: nextion
    name: $device_name Level Page Slider
    id: level_value
    internal: true
    component_name: p6S0
    on_value:
      then:
        - lambda: |-
              char buf[128];
              float slider = id(level_value).state;
              std::string lvlval = esphome::to_string(slider);
              sprintf(buf, (id(panel_mqtt_client).get_active_topic_prefix() + "/event/level/set/%d").c_str(), id(selectedIndex));
              id(mqtt_client).publish(buf, lvlval);


  - platform: nextion
    name: $device_name Info Page Slider
    id: info_level_value
    internal: true
    component_name: p7S0
    on_value:
      then:
        - lambda: |-
              float slider = id(info_level_value).state;
              std::string lvlval = esphome::to_string(slider);
              id(mqtt_client).publish_json((id(panel_mqtt_client).get_active_topic_prefix() + "/event/infolevel/set").c_str(),[=](JsonObject root) {
                  root["topic"] = id(infoTopic);
                  root["levelTopic"] = id(levelTopic);
                  root["level"] = lvlval;
               });


