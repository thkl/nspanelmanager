button:
  - platform: restart
    id: reboot_button
    internal: true

switch:

  - platform: gpio
    internal: false
    name: $device_name Relay 1
    id: relay_1
    pin:
      number: 22
    on_turn_off:
      then:
        lambda: 'id(mqtt_client).publish((id(panel_mqtt_client).get_active_topic_prefix() + "/event/relay/1").c_str(),"0");'

    on_turn_on:
      then:
        lambda: 'id(mqtt_client).publish((id(panel_mqtt_client).get_active_topic_prefix() + "/event/relay/1").c_str(),"1");'

  - platform: gpio
    internal: false
    name: $device_name Relay 2
    id: relay_2
    pin:
      number: 19
    on_turn_off:
      then:
        lambda: 'id(mqtt_client).publish((id(panel_mqtt_client).get_active_topic_prefix() + "/event/relay/2").c_str(),"0");'

    on_turn_on:
      then:
        lambda: 'id(mqtt_client).publish((id(panel_mqtt_client).get_active_topic_prefix() + "/event/relay/2").c_str(),"1");'


    # Pin 4 always needs to be on to power up the display
  - platform: gpio
    internal: true
    id: screen_power
    entity_category: config
    pin:
      number: 4
      inverted: true
    restore_mode: ALWAYS_ON


  # Configure the internal bleeper
output:
  - platform: ledc
    id: buzzer_out
    pin:
      number: 21

  # Enable ringtone music support
rtttl:
  id: buzzer
  output: buzzer_out

  # Configure UART for communicating with the screen
uart:
  id: tf_uart
  tx_pin: 16
  rx_pin: 17
  baud_rate: 115200

  # Configure the screen itself
display:
  - platform: nextion
    id: disp1
    uart_id: tf_uart
    tft_url: $display_update_url
    on_setup:
      then:
        - lambda: |-
                id(roomstatus).state = 0;
        - if:
            condition:
              lambda: return id(hmi_update_pending) && !id(pending_hmi_version).empty();
            then:
              - lambda: id(mqtt_client).enable();
              - wait_until:
                  condition:
                    mqtt.connected:
                  timeout: 15s
              - lambda: |-
                  std::string completed_job_id = id(pending_hmi_job_id);
                  std::string completed_version = id(pending_hmi_version);
                  id(hmi_version) = id(pending_hmi_version);
                  id(pending_hmi_version).clear();
                  id(pending_hmi_job_id).clear();
                  id(hmi_update_pending) = false;
                  ESP_LOGI("hmi", "Nextion reconnected after TFT update; recording HMI version %s", id(hmi_version).c_str());
                  hmi_version->update();
                  pending_hmi_version->update();
                  pending_hmi_job_id->update();
                  hmi_update_pending->update();
                  esphome::global_preferences->sync();
                  id(publish_hmi_update_status)->execute(completed_job_id, "succeeded", completed_version, "The display reconnected with the requested HMI.");
              - script.execute: publish_panel_ping
        - script.execute: publish_panel_display_ready
