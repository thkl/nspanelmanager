sensor:

  - platform: debug
    free:
      name: $device_name Free Heap
      id: debug_heap_free
      internal: true
    min_free:
      name: $device_name Minimum Free Heap
      id: debug_heap_min_free
      internal: true
    block:
      name: $device_name Largest Free Heap Block
      id: debug_heap_block
      internal: true
    loop_time:
      name: $device_name Main Loop Time
      id: debug_loop_time
      internal: true

  - platform: internal_temperature
    name: $device_name Chip Temperature
    id: panel_chip_temperature
    internal: true
    update_interval: 30s

  - platform: uptime
    name: $device_name Uptime
    id: panel_uptime
    internal: true
    type: seconds
    update_interval: 30s

  - platform: nextion
    name: $device_name Level Page Slider
    id: level_value
    internal: true
    component_name: p6S0
    on_value:
      then:
        - lambda: |-
              char buf[128];
              float slider = id(level_value).state;
              std::string lvlval = esphome::to_string(slider);
              sprintf(buf, "$node_name/event/level/set/%d", id(selectedIndex));
              id(mqtt_client).publish(buf, lvlval);


  - platform: nextion
    name: $device_name Info Page Slider
    id: info_level_value
    internal: true
    component_name: p7S0
    on_value:
      then:
        - lambda: |-
              float slider = id(info_level_value).state;
              std::string lvlval = esphome::to_string(slider);
              id(mqtt_client).publish_json("$node_name/event/infolevel/set",[=](JsonObject root) {
                  root["topic"] = id(infoTopic);
                  root["levelTopic"] = id(levelTopic);
                  root["level"] = lvlval;
               });


  - platform: mqtt_subscribe
    name: $device_name set favState
    id: favState
    internal: true
    topic: $node_name/cmnd/favstate
    on_value:
      then:
        - script.execute: update_favstate

  - platform: mqtt_subscribe
    name: $device_name update level status
    id: level_status
    internal: true
    topic: $node_name/cmnd/level/status
    on_value:
      then:
        - script.execute: update_level

      #make the slider visible after the first data returnd
        - lambda: |-
            if (id(currentPage)=="pageLevel") {
              id(disp1).send_command_printf("vis p6S0,1");
            }

