    component_name: colorWheel
    on_value:
      then:
        lambda: |-
          id(mqtt_client).publish_json("$node_name/event/colorLamp/set",[=](JsonObject root) { root["topic"] =id(colorLamp);root["color"] = id(colorWheel).state.c_str(); });



  - platform: mqtt_subscribe
    name: $device_name set AlarmTime
    id: alarmtime
    internal: true
    topic: $node_name/cmnd/alarmtime
    on_value:
      then:
        - script.execute: update_time


#internal relay 1
  - platform: mqtt_subscribe
    name: $device_name switch relay 1
    id: mqtt_relay_1
    internal: true
    topic: $node_name/cmnd/relay/1
    on_value:
      then:
        - lambda: |-
              if (id(mqtt_relay_1).state=="0") {
                id(relay_1).turn_off();
              }
              if (id(mqtt_relay_1).state=="1") {
                id(relay_1).turn_on();
              }
              if (id(mqtt_relay_1).state=="toggle") {
                id(relay_1).toggle();
              }

#internal relay 2
  - platform: mqtt_subscribe
    name: $device_name switch relay 2
    id: mqtt_relay_2
    internal: true
    topic: $node_name/cmnd/relay/2
    on_value:
      then:
        - lambda: |-
              if (id(mqtt_relay_2).state=="0") {
                id(relay_2).turn_off();
              }
              if (id(mqtt_relay_2).state=="1") {
                id(relay_2).turn_on();
              }
              if (id(mqtt_relay_2).state=="toggle") {
                id(relay_2).toggle();
              }

