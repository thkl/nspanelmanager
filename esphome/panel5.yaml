button:
  - platform: restart
    id: reboot_button
    internal: true

switch:

  - platform: gpio
    internal: false
    name: $device_name Relay 1
    id: relay_1
    pin:
      number: 22
    on_turn_off:
      then:
        lambda: 'id(mqtt_client).publish("$node_name/event/relay/1","0");'

    on_turn_on:
      then:
        lambda: 'id(mqtt_client).publish("$node_name/event/relay/1","1");'

  - platform: gpio
    internal: false
    name: $device_name Relay 2
    id: relay_2
    pin:
      number: 19
    on_turn_off:
      then:
        lambda: 'id(mqtt_client).publish("$node_name/event/relay/2","0");'

    on_turn_on:
      then:
        lambda: 'id(mqtt_client).publish("$node_name/event/relay/2","1");'


    # Pin 4 always needs to be on to power up the display
  - platform: gpio
    internal: true
    id: screen_power
    entity_category: config
    pin:
      number: 4
      inverted: true
    restore_mode: ALWAYS_ON


  # Configure the internal bleeper
output:
  - platform: ledc
    id: buzzer_out
    pin:
      number: 21

  # Enable ringtone music support
rtttl:
  id: buzzer
  output: buzzer_out

  # Configure UART for communicating with the screen
uart:
  id: tf_uart
  tx_pin: 16
  rx_pin: 17
  baud_rate: 115200

  # Configure the screen itself
display:
  - platform: nextion
    id: disp1
    uart_id: tf_uart
    tft_url: $display_update_url
    on_setup:
      then:
        - lambda: |-
                id(roomstatus).state = 0;
