services:
  manager:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: ${DATA_DIR:-/data}
      LOG_DIR: ${LOG_DIR:-}
      USER_STORE_SET_PERMISSIONS: ${USER_STORE_SET_PERMISSIONS:-true}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET_FILE: ${OIDC_CLIENT_SECRET_FILE:-}
      MANAGER_ENCRYPTION_KEY_FILE: /run/secrets/manager_encryption_key
    volumes:
      - type: volume
        source: manager-data
        target: ${DATA_DIR:-/data}
    secrets:
      - manager_encryption_key
    restart: unless-stopped

volumes:
  manager-data:

secrets:
  manager_encryption_key:
    file: ./secrets/manager_encryption_key
