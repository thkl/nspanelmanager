services:
  manager:
    environment:
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set the public HTTPS origin for the manager}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?Set the OIDC issuer URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set the OIDC client ID}
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    secrets:
      - manager_encryption_key
      - oidc_client_secret

secrets:
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
